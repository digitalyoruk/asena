[project]
name = "asena-engine"
version = "0.1.0"
description = "Asena Yerel Motor: cihazdaki TTS (EMA Lightning, Antalia-2 Mini) ve LLM (Ollama/Kumru) modellerini bulur ve 127.0.0.1 üzerinden sunar."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "huggingface-hub>=0.23",
  "numpy>=1.24",
  "ema-lightning==1.1.2",
  "antalia-mini==1.0.1",
]

[project.optional-dependencies]
stt = ["mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'", "python-multipart>=0.0.9"]

[project.scripts]
asena-engine = "asena_engine.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asena_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
